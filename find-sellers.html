<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Find Sellers</title>

<style>
body{margin:0;font-family:Arial;background:#07141d;color:white;}

header{
background:#041018;
padding:20px 60px;
border-bottom:1px solid #1c3c50;
}

.logo{color:#d4af37;font-size:24px;font-weight:bold;}

.filter{padding:40px 60px;}

select,button{
padding:12px;
margin-right:15px;
background:#07141d;
border:1px solid #1c3c50;
color:white;
}

.sellers{
padding:40px 60px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
}

.card{
background:#041018;
padding:25px;
border-radius:8px;
}

.card h3{color:#d4af37;}
</style>
</head>

<body>

<header>
<div class="logo">PetroTrade Global</div>
</header>

<div class="filter">

<select id="country">
<option value="all">All Countries</option>
<option value="uae">UAE</option>
<option value="saudi">Saudi Arabia</option>
<option value="nigeria">Nigeria</option>
</select>

<button onclick="filter()">Search</button>

</div>

<div class="sellers">

<div class="card" data-country="uae">
<h3>Al Noor Petroleum Trading</h3>
<p>Country: UAE</p>
<p>Product: Diesel EN590</p>
</div>

<div class="card" data-country="nigeria">
<h3>Global Energy Export Ltd</h3>
<p>Country: Nigeria</p>
<p>Product: Crude Oil</p>
</div>

<div class="card" data-country="saudi">
<h3>Arabian Fuel Supply</h3>
<p>Country: Saudi Arabia</p>
<p>Product: Jet Fuel A1</p>
</div>

</div>

<script>
function filter(){
let c=document.getElementById("country").value;
let cards=document.querySelectorAll(".card");

cards.forEach(card=>{
if(c==="all"||card.getAttribute("data-country")===c){
card.style.display="block";
}else{
card.style.display="none";
}
});
}
</script>

</body>
</html>
