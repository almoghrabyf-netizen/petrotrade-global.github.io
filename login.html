<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - PetroTrade Global</title>

<style>
body{
margin:0;
font-family:Arial;
background:#07141d;
color:white;
}

/* HEADER */
header{
background:#041018;
padding:20px 60px;
border-bottom:1px solid #1c3c50;
}

.logo{
color:#d4af37;
font-size:24px;
font-weight:bold;
}

/* LOGIN BOX */
.login-box{
max-width:500px;
margin:80px auto;
background:#041018;
padding:40px;
border-radius:8px;
}

.login-box h2{
margin-bottom:25px;
}

input, select{
width:100%;
padding:14px;
margin-top:15px;
background:#07141d;
border:1px solid #1c3c50;
color:white;
}

button{
margin-top:25px;
width:100%;
padding:15px;
background:#d4af37;
border:none;
font-size:16px;
cursor:pointer;
}

.back{
margin-top:20px;
display:block;
text-align:center;
color:#d4af37;
text-decoration:none;
}
</style>
</head>

<body>

<header>
<div class="logo">PetroTrade Global</div>
</header>

<div class="login-box">

<h2>Login to Your Account</h2>

<select>
<option>Login as Buyer</option>
<option>Login as Seller</option>
</select>

<input type="email" placeholder="Email Address">
<input type="password" placeholder="Password">

<button>Login</button>

<a href="index.html" class="back">Back to Home</a>

</div>

</body>
</html>
