<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - PetroTrade Global</title>

<style>
body{margin:0;font-family:Arial;background:#07141d;color:white;}

header{
background:#041018;
padding:20px 60px;
border-bottom:1px solid #1c3c50;
}

.logo{color:#d4af37;font-size:24px;font-weight:bold;}

.form{
max-width:500px;
margin:80px auto;
background:#041018;
padding:40px;
border-radius:8px;
}

input,select{
width:100%;
padding:14px;
margin-top:15px;
background:#07141d;
border:1px solid #1c3c50;
color:white;
}

button{
margin-top:25px;
width:100%;
padding:15px;
background:#d4af37;
border:none;
font-size:16px;
}

a{color:#d4af37;text-decoration:none;display:block;margin-top:20px;text-align:center;}
</style>
</head>

<body>

<header>
<div class="logo">PetroTrade Global</div>
</header>

<div class="form">

<h2>Login</h2>

<select>
<option>Login as Buyer</option>
<option>Login as Seller</option>
</select>

<input type="email" placeholder="Email">
<input type="password" placeholder="Password">

<button>Login</button>

<a href="index.html">Back to Home</a>

</div>

</body>
</html>
