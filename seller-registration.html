<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Registration - PetroTrade Global</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #0b1d2a;
    color: white;
}

header {
    background-color: #081620;
    padding: 20px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1e3a4d;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #d4af37;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 30px;
    font-size: 14px;
}

.form-section {
    max-width: 800px;
    margin: 60px auto;
    background-color: #081620;
    padding: 40px;
    border-radius: 8px;
}

h1 {
    margin-bottom: 10px;
}

p {
    color: #cfd8dc;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
    font-size: 14px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    background-color: #0b1d2a;
    border: 1px solid #1e3a4d;
    color: white;
    border-radius: 4px;
}

textarea {
    height: 120px;
}

button {
    margin-top: 30px;
    width: 100%;
    padding: 15px;
    background-color: #d4af37;
    color: black;
    font-size: 16px;
    border: none;
    cursor: pointer;
}

footer {
    background-color: #050e14;
    padding: 30px;
    text-align: center;
    color: #9aa5ab;
    margin-top: 60px;
}
</style>
</head>

<body>

<header>
<div class="logo">PetroTrade Global</div>
<nav>
<a href="index.html">Home</a>
<a href="#">Find Sellers</a>
<a href="#">Find Buyers</a>
<a href="#">Login</a>
</nav>
</header>

<section class="form-section">

<h1>Seller Registration</h1>
<p>Register your company and start selling crude oil and petroleum products to verified international buyers.</p>

<label>Company Name</label>
<input type="text" placeholder="Enter company name">

<label>Country</label>
<select>
<option>United Arab Emirates</option>
<option>Saudi Arabia</option>
<option>Qatar</option>
<option>Kuwait</option>
<option>United States</option>
<option>Nigeria</option>
<option>Germany</option>
<option>India</option>
<option>China</option>
</select>

<label>Product You Sell</label>
<select>
<option>Crude Oil</option>
<option>Diesel EN590</option>
<option>Jet Fuel A1</option>
<option>LNG</option>
<option>LPG</option>
<option>Other Petroleum Product</option>
</select>

<label>Available Quantity (Monthly)</label>
<input type="text" placeholder="Example: 100,000 MT per month">

<label>Contact Person</label>
<input type="text" placeholder="Full name">

<label>Email Address</label>
<input type="email" placeholder="example@company.com">

<label>Phone Number</label>
<input type="text" placeholder="+971 ...">

<label>Company Details</label>
<textarea placeholder="Write details about your company, refinery, trading license, or export capability"></textarea>

<button>Register as Seller</button>

</section>

<footer>
<p>PetroTrade Global © 2026 | International Petroleum Trading Platform</p>
</footer>

</body>
</html>
