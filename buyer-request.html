<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyer Request - PetroTrade Global</title>

<style>
body{
margin:0;
font-family:Arial;
background:#07141d;
color:white;
}

header{
background:#041018;
padding:20px 60px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #1c3c50;
}

.logo{
font-size:24px;
color:#d4af37;
font-weight:bold;
}

.form{
max-width:700px;
margin:60px auto;
background:#041018;
padding:40px;
border-radius:8px;
}

label{
display:block;
margin-top:20px;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:10px;
background:#07141d;
border:1px solid #1c3c50;
color:white;
}

button{
margin-top:30px;
width:100%;
padding:15px;
background:#d4af37;
border:none;
font-size:16px;
}

footer{
background:#020b11;
padding:30px;
text-align:center;
margin-top:60px;
}
</style>
</head>

<body>

<header>
<div class="logo">PetroTrade Global</div>
</header>

<div class="form">
<h2>Buyer Request Form</h2>

<label>Company Name</label>
<input type="text">

<label>Country</label>
<select>
<option>United Arab Emirates</option>
<option>Saudi Arabia</option>
<option>Qatar</option>
<option>Kuwait</option>
<option>Germany</option>
<option>United States</option>
</select>

<label>Product Needed</label>
<select>
<option>Crude Oil</option>
<option>Diesel EN590</option>
<option>Jet Fuel A1</option>
<option>LNG</option>
</select>

<label>Quantity (MT)</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Message</label>
<textarea></textarea>

<button>Send Request</button>
</div>

<footer>
PetroTrade Global © 2026
</footer>

</body>
</html>
