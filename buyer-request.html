<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyer Request - PetroTrade Global</title>

<style>
body{margin:0;font-family:Arial;background:#07141d;color:white;}
header{background:#041018;padding:20px 60px;border-bottom:1px solid #1c3c50;}
.logo{color:#d4af37;font-size:24px;font-weight:bold;}
.form{max-width:700px;margin:60px auto;background:#041018;padding:40px;border-radius:8px;}
input,select,textarea{width:100%;padding:12px;margin-top:15px;background:#07141d;border:1px solid #1c3c50;color:white;}
button{margin-top:25px;width:100%;padding:15px;background:#d4af37;border:none;}
</style>
</head>

<body>

<header>
<div class="logo">PetroTrade Global</div>
</header>

<div class="form">
<h2>Buyer Request Form</h2>

<input type="text" placeholder="Company Name">
<select>
<option>United Arab Emirates</option>
<option>Saudi Arabia</option>
<option>Qatar</option>
<option>Kuwait</option>
</select>

<select>
<option>Crude Oil</option>
<option>Diesel EN590</option>
<option>Jet Fuel A1</option>
</select>

<input type="text" placeholder="Quantity (MT)">
<input type="email" placeholder="Email">
<textarea placeholder="Message"></textarea>

<button>Send Request</button>
</div>

</body>
</html>
