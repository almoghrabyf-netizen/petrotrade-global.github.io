<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetroTrade Platform</title>

<style>
body{
    font-family: Arial;
    margin:0;
    background:#f4f4f4;
}

/* HEADER */
header{
    background:#111;
    color:white;
    text-align:center;
    padding:15px;
}

/* NAV */
nav{
    background:#222;
    padding:10px;
    text-align:center;
}

nav button{
    padding:10px 15px;
    margin:5px;
    border:none;
    background:#ff9800;
    color:white;
    cursor:pointer;
}

/* SECTIONS */
.section{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

/* FORM */
form{
    background:white;
    padding:20px;
    max-width:450px;
    margin:auto;
    box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

input, select, textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
}

button.submit{
    background:#28a745;
    color:white;
    margin-top:15px;
}

/* MARKET PANEL */
.market{
    background:white;
    max-width:600px;
    margin:20px auto;
    padding:20px;
    text-align:center;
    box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

.price{
    font-size:20px;
    margin:10px 0;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>PetroTrade Platform</h1>
<p>Buy & Sell Petroleum Products Worldwide</p>
</header>

<nav>
<button onclick="showSection('login')">Login</button>
<button onclick="showSection('buyer')">Buyer Request</button>
<button onclick="showSection('seller')">Register as Seller</button>
<button onclick="showSection('market')">Market Prices</button>
<button onclick="showSection('dashboard')">Dashboard</button>
</nav>

<!-- LOGIN -->
<div id="login" class="section active">
<form id="loginForm">
<h2>Login</h2>

<input type="email" id="loginEmail" placeholder="Email" required>
<input type="password" id="loginPassword" placeholder="Password" required>

<button class="submit" type="submit">Login</button>

<hr>

<h3>Create Account</h3>

<input type="email" id="regEmail" placeholder="Email" required>
<input type="password" id="regPassword" placeholder="Password" required>

<button type="button" onclick="createAccount()" class="submit">Create Account</button>
</form>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section">
<div style="text-align:center; font-size:22px; padding:30px;">
<h2>Welcome to PetroTrade</h2>
<p>You are logged in successfully</p>
</div>
</div>

<!-- BUYER -->
<div id="buyer" class="section">
<form>
<h2>Buyer Request Form</h2>
<input placeholder="Company Name" required>
<input placeholder="Country" required>

<select>
<option>Diesel EN590</option>
<option>Jet Fuel</option>
<option>Crude Oil</option>
</select>

<input placeholder="Quantity (MT)" required>

<button class="submit">Submit</button>
</form>
</div>

<!-- SELLER -->
<div id="seller" class="section">
<form>
<h2>Register as Seller</h2>

<input placeholder="Company Name" required>
<input placeholder="Country" required>
<input placeholder="Contact Email" required>

<select>
<option>Diesel EN590</option>
<option>Jet Fuel</option>
<option>Crude Oil</option>
</select>

<button class="submit">Register</button>
</form>
</div>

<!-- MARKET PRICES -->
<div id="market" class="section">
<div class="market">
<h2>Market Prices</h2>

<div class="price">Gold Price: <span id="gold">Loading...</span></div>
<div class="price">Diesel EN590 Price: <span id="diesel">Loading...</span></div>

<button onclick="updatePrices()">Refresh Prices</button>
</div>
</div>

<script>

/* NAVIGATION */
function showSection(id){
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* CREATE ACCOUNT */
function createAccount(){

    let email = document.getElementById("regEmail").value;
    let password = document.getElementById("regPassword").value;

    if(email === "" || password === ""){
        alert("Please fill all fields");
        return;
    }

    localStorage.setItem("userEmail", email);
    localStorage.setItem("userPass", password);

    alert("Account created successfully!");
}

/* LOGIN */
document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    let email = document.getElementById("loginEmail").value;
    let password = document.getElementById("loginPassword").value;

    let savedEmail = localStorage.getItem("userEmail");
    let savedPass = localStorage.getItem("userPass");

    if(email === savedEmail && password === savedPass){
        showSection("dashboard");
    }else{
        alert("Wrong email or password");
    }
});

/* PRICE FUNCTION (THIS WAS MISSING BEFORE) */
function updatePrices(){

    let gold = (2300 + Math.random()*50).toFixed(2);
    let diesel = (780 + Math.random()*40).toFixed(2);

    document.getElementById("gold").innerText = "$ " + gold + " / oz";
    document.getElementById("diesel").innerText = "$ " + diesel + " / MT";
}

/* AUTO LOAD PRICES */
updatePrices();

</script>

</body>
</html>
