<!DOCTYPE html>
<html>
<head>
<title>PetroTrade Global</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#071c26;
    color:white;
}
.box{
    width:400px;
    margin:100px auto;
    background:#081f2b;
    padding:30px;
    border-radius:10px;
}
input,button{
    width:100%;
    padding:12px;
    margin-top:10px;
}
button{
    background:#d4af37;
    border:none;
}
</style>
</head>

<body>

<div class="box">
<h2>Create Account</h2>

<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="saveUser()">Create Account</button>
</div>

<script>

function saveUser(){
    let email=document.getElementById("email").value;
    let pass=document.getElementById("pass").value;

    localStorage.setItem("email",email);
    localStorage.setItem("pass",pass);

    alert("Account saved successfully!");
}

</script>

</body>
</html>
