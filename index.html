<!DOCTYPE html>

    <input type="number" id="quantity" placeholder="Quantity (MT)">
    <input type="email" id="buyerEmail" placeholder="Email">

    <textarea id="message" placeholder="Message"></textarea>

    <button onclick="saveRequest()">Send Request</button>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage" class="dashboard" style="display:none;">
    <h2>Dashboard</h2>
    <div id="requests"></div>
</div>

<script>

function showPage(page) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('buyerPage').style.display = 'none';
    document.getElementById('dashboardPage').style.display = 'none';

    document.getElementById(page).style.display = 'block';
}

function showRegister() {
    document.getElementById('registerSection').style.display = 'block';
}

// REGISTER USER
function registerUser() {
    const user = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
    };

    let users = JSON.parse(localStorage.getItem('users')) || [];
    users.push(user);
    localStorage.setItem('users', JSON.stringify(users));

    alert('Account created successfully!');
}

// LOGIN USER
function loginUser() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    let users = JSON.parse(localStorage.getItem('users')) || [];

    const validUser = users.find(u => u.email === email && u.password === password);

    if(validUser) {
        alert('Login successful');
        showPage('dashboardPage');
        loadRequests();
    } else {
        alert('Wrong email or password');
    }
}

// SAVE BUYER REQUEST
function saveRequest() {
    const request = {
        company: document.getElementById('company').value,
        country: document.getElementById('country').value,
        product: document.getElementById('product').value,
        quantity: document.getElementById('quantity').value,
        email: document.getElementById('buyerEmail').value,
        message: document.getElementById('message').value
    };

    let requests = JSON.parse(localStorage.getItem('buyerRequests')) || [];
    requests.push(request);
    localStorage.setItem('buyerRequests', JSON.stringify(requests));

    alert('Request sent successfully');
}

// LOAD REQUESTS IN DASHBOARD
function loadRequests() {
    let requests = JSON.parse(localStorage.getItem('buyerRequests')) || [];
    const container = document.getElementById('requests');
    container.innerHTML = '';

    requests.forEach(r => {
        container.innerHTML += `
        <div class="card">
            <h3>${r.company}</h3>
            <p><b>Country:</b> ${r.country}</p>
            <p><b>Product:</b> ${r.product}</p>
            <p><b>Quantity:</b> ${r.quantity} MT</p>
            <p><b>Email:</b> ${r.email}</p>
            <p>${r.message}</p>
        </div>`;
    });
}

</script>

</body>
</html>
