<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetroTrade Platform</title>

<style>
body{
    font-family: Arial;
    margin:0;
    background:#f4f4f4;
}

/* HEADER */
header{
    background:#111;
    color:white;
    text-align:center;
    padding:15px;
}

/* NAV */
nav{
    background:#222;
    padding:10px;
    text-align:center;
}

nav button{
    padding:10px 15px;
    margin:5px;
    border:none;
    background:#ff9800;
    color:white;
    cursor:pointer;
}

/* SECTIONS */
.section{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

/* FORM */
form{
    background:white;
    padding:20px;
    max-width:450px;
    margin:auto;
    box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

input, select, textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
}

button.submit{
    background:#28a745;
    color:white;
    margin-top:15px;
}

/* DASHBOARD */
.dashboard{
    text-align:center;
    padding:30px;
    font-size:22px;
}
</style>
</head>

<body>

<header>
<h1>PetroTrade Platform</h1>
</header>

<nav>
<button onclick="showSection('login')">Login</button>
<button onclick="showSection('buyer')">Buyer Request</button>
<button onclick="showSection('seller')">Register Seller</button>
<button onclick="showSection('dashboard')">Dashboard</button>
</nav>

<!-- LOGIN -->
<div id="login" class="section active">
<form id="loginForm">
<h2>Login</h2>

<input type="text" id="loginUser" placeholder="Username" required>
<input type="password" id="loginPass" placeholder="Password" required>

<button class="submit" type="submit">Login</button>

<hr>

<h3>Create Account</h3>

<input type="text" id="regUser" placeholder="Username" required>
<input type="password" id="regPass" placeholder="Password" required>

<button class="submit" type="button" onclick="register()">Create Account</button>
</form>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section">
<div class="dashboard">
<h2>Welcome to PetroTrade</h2>
<p>You are now logged in successfully</p>
</div>
</div>

<!-- BUYER -->
<div id="buyer" class="section">
<form>
<h2>Buyer Request</h2>
<input placeholder="Company Name" required>
<input placeholder="Country" required>
<select>
<option>Diesel EN590</option>
<option>Jet Fuel</option>
<option>Crude Oil</option>
</select>
<input placeholder="Quantity (MT)" required>
<button class="submit">Submit</button>
</form>
</div>

<!-- SELLER -->
<div id="seller" class="section">
<form>
<h2>Seller Registration</h2>
<input placeholder="Company Name" required>
<input placeholder="Country" required>
<input placeholder="Contact Email" required>
<select>
<option>Diesel EN590</option>
<option>Jet Fuel</option>
<option>Crude Oil</option>
</select>
<button class="submit">Register</button>
</form>
</div>

<script>

/* NAVIGATION */
function showSection(id){
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* REGISTER ACCOUNT */
function register(){

    let user = document.getElementById("regUser").value;
    let pass = document.getElementById("regPass").value;

    if(user === "" || pass === ""){
        alert("Please fill username and password");
        return;
    }

    localStorage.setItem("user", user);
    localStorage.setItem("pass", pass);

    alert("Account created successfully!");
}

/* LOGIN */
document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    let user = document.getElementById("loginUser").value;
    let pass = document.getElementById("loginPass").value;

    let savedUser = localStorage.getItem("user");
    let savedPass = localStorage.getItem("pass");

    if(user === savedUser && pass === savedPass){
        showSection("dashboard");
    }else{
        alert("Wrong username or password");
    }

});

</script>

</body>
</html>
